version: '3.8'

services:
  app:
    image: math-functions-app
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/lab_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=user
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - math-network

networks:
  math-network:
    driver: bridge
